name: Citron iPhoneOS prototype (UNTESTED)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citron-ios-prototype-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned-iphoneos:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      CITRON_COMMIT: c3aa70f81e15ea97ee85b6a9a71cbf75d370851e
      CODE_SIGNING_ALLOWED: 'NO'
      CODE_SIGNING_REQUIRED: 'NO'
      CODE_SIGN_IDENTITY: ''
      EXPANDED_CODE_SIGN_IDENTITY: ''
    steps:
      - name: Checkout this portable build project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Report toolchain and install host-only tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          xcodebuild -version | tee dist/xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version | tee dist/iphoneos-sdk-version.txt
          brew install cmake ninja glslang pkg-config
          cmake --version | tee dist/cmake-version.txt
          command -v glslangValidator

      - name: Fetch the fixed official source commit
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/citron-source"
          git -C "$RUNNER_TEMP/citron-source" remote add origin https://github.com/citron-neo/emulator.git
          git -C "$RUNNER_TEMP/citron-source" fetch --depth=1 origin "$CITRON_COMMIT"
          git -C "$RUNNER_TEMP/citron-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/citron-source" rev-parse HEAD)" = "$CITRON_COMMIT"

      - name: Build verified iPhoneOS dependencies
        shell: bash
        run: bash scripts/build-ios-deps.sh "$RUNNER_TEMP/citron-ios-deps" 2>&1 | tee dist/dependencies.log

      - name: Apply candidate patches and compile the iPhoneOS app
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-citron-ios.sh \
            "$RUNNER_TEMP/citron-source" "$RUNNER_TEMP/citron-ios-deps" \
            "$RUNNER_TEMP/citron-ios-build" 2>&1 | tee dist/build.log

      - name: Inspect and package the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-ios.py "$RUNNER_TEMP/citron-ios-build" \
            "$RUNNER_TEMP/citron-ios-deps/licenses" dist

      - name: Upload IPA only after a successful build and package inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node24)
        with:
          name: Citron-iOS-UNSIGNED-c3aa70f81
          path: |
            dist/*.ipa
            dist/package-inspection.json
            dist/licenses/
          if-no-files-found: error
          retention-days: 3

      - name: Preserve build diagnostics, including on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node24)
        with:
          name: Citron-iOS-build-diagnostics
          path: |
            dist/*.log
            dist/*-version.txt
          if-no-files-found: ignore
          retention-days: 3
